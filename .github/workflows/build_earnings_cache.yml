name: Build T2D earnings cache

on:
  # Approximate 6am ET on weekdays.
  # GitHub cron is in UTC:
  # - 6am ET ≈ 11:00 UTC when ET is UTC-5
  schedule:
    - cron: "0 11 * * 1-5"  # ~6am ET, Mon-Fri
  # Allow manual runs from the Actions tab
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Test the failure email (stops before touching any data)"
        type: boolean
        default: false

permissions:
  contents: write
  # Failure notices are posted as an issue, which GitHub emails to the owner
  issues: write

jobs:
  build-earnings-cache:
    runs-on: ubuntu-latest
    env:
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, installing minimal deps."
            pip install requests
          fi

      - name: Build earnings_cache.json
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          echo "=== T2D earnings_cache.json builder ==="
          python build_earnings_cache.py

      - name: Derive latest + per-day history snapshot (New York time, morning run)
        run: |
          set -e

          # Trading date in America/New_York
          TRADING_DATE=$(TZ=America/New_York date +%F)   # e.g. 2025-11-10
          echo "Trading date (NY): $TRADING_DATE"

          if [ ! -f "earnings_cache.json" ]; then
            echo "earnings_cache.json not found. Did build_earnings_cache.py run correctly?"
            exit 1
          fi

          # 1) Always update the rolling latest file from the fresh cache
          cp earnings_cache.json earnings_latest.json
          echo "Updated earnings_latest.json"

          # 2) Morning run = freeze history for this trading date (once per day)
          mkdir -p earnings_history
          cp earnings_cache.json "earnings_history/earnings_${TRADING_DATE}.json"
          echo "Wrote history snapshot for trading date $TRADING_DATE"

      - name: Commit and push updated cache and history
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f "earnings_cache.json" ]; then
            git add earnings_cache.json
          fi
          if [ -f "earnings_latest.json" ]; then
            git add earnings_latest.json
          fi
          if [ -d "earnings_history" ]; then
            git add earnings_history
          fi

          if git diff --cached --quiet; then
            echo "No changes in cache; nothing to commit."
          else
            git commit -m "Update earnings cache and history [CI]"
            git push
          fi

      # On failure: open (or add to) an issue that @mentions the owner, so
      # GitHub emails a plain-English explanation. One open issue at a time.
      - name: Email owner about the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Earnings calendar update failed"

          LAST_GOOD=$(gh api "repos/$GH_REPO/commits?path=earnings_latest.json&per_page=1" \
            --jq '.[0].commit.committer.date' 2>/dev/null || true)
          if [ -n "$LAST_GOOD" ]; then
            LAST_GOOD=$(TZ=America/New_York date -d "$LAST_GOOD" '+%A, %B %-d, %Y')
          else
            LAST_GOOD="the last successful update"
          fi

          {
            echo "@jmaietta, today's update of the TEK2day Earnings Calendar failed."
            echo
            echo "**What went wrong:**"
            if [ -f build_failure.txt ]; then
              cat build_failure.txt
            else
              echo "A step outside the Alpha Vantage download failed (for example setting up the job or saving the new data). The details link below shows which step."
            fi
            echo
            echo "**What this means:** Nothing was overwritten. The calendar site and Kilby keep using the last good data, from $LAST_GOOD. The update tries again next weekday morning, and you'll get an email when it works again."
            echo
            echo "**Details:** $RUN_URL"
          } > issue_body.md

          NUM=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file issue_body.md
          else
            gh issue create --title "$TITLE" --body-file issue_body.md
          fi

      - name: Email owner when updates work again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NUM=$(gh issue list --state open --search "\"Earnings calendar update failed\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "@jmaietta, fixed: today's update worked. The calendar site and Kilby have fresh data again."
          fi
